<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="foa_mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>foa_mobile</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Identity Services SDK (synchronous load to avoid race condition) -->
  <script src="https://accounts.google.com/gsi/client"></script>
  <script>
    (function () {
      // Poll until GIS SDK is available (up to 10s), then memoize.
      var sdkReady = new Promise(function (resolve, reject) {
        var start = Date.now();
        (function poll() {
          if (window.google && window.google.accounts && window.google.accounts.oauth2) {
            resolve();
            return;
          }
          if (Date.now() - start >= 10000) {
            reject(new Error('Google Identity SDK không tải được sau 10 giây. Vui lòng tải lại trang.'));
            return;
          }
          setTimeout(poll, 50);
        })();
      });

      // Internal factory — returns a Promise that resolves with the access token.
      function openGoogleOAuthPopup(clientId) {
        return new Promise(function (resolve, reject) {
          try {
            var client = window.google.accounts.oauth2.initTokenClient({
              client_id: clientId,
              scope: 'email profile openid',
              callback: function (response) {
                if (response && response.access_token) {
                  resolve(response.access_token);
                } else {
                  reject(new Error('Người dùng hủy hoặc không cấp quyền lấy Access Token.'));
                }
              },
              error_callback: function (err) {
                reject(new Error(err.message || 'Lỗi xác thực Google.'));
              },
            });
            client.requestAccessToken();
          } catch (e) {
            reject(e);
          }
        });
      }

      // Expose the Google Sign-In function to Dart (Flutter web).
      window.initiateGoogleSignInWeb = function (clientId) {
        // Fast path: SDK is already loaded — open popup synchronously
        // in the same microtask as the user gesture (avoids popup blocker).
        if (window.google && window.google.accounts && window.google.accounts.oauth2) {
          return openGoogleOAuthPopup(clientId);
        }
        // Slow path: need to wait for SDK (first load).
        return sdkReady.then(function () {
          return openGoogleOAuthPopup(clientId);
        });
      };
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
