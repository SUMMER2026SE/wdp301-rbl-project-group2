services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - local-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env # Chứa MONGODB_URI=mongodb+srv://... (Trỏ tới DB 'my_app_local' trên Atlas)
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - local-network

networks:
  local-network:
    driver: bridge
