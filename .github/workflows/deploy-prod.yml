name: Build and Deploy (Prod)

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4


      # --- BƯỚC 1: BUILD & PUSH LÊN DOCKER HUB ---
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/anngon-frontend:latest ./frontend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/anngon-backend:latest ./backend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/anngon-nginx:latest ./nginx
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/anngon-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/anngon-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/anngon-nginx:latest

      # --- BƯỚC 3: DEPLOY LÊN VPS QUA SSH ---
      - name: 🚀 Sync Compose to VPS (Tự động copy file cấu hình)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/anngon/anngon-prod"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/anngon/anngon-prod
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml down
            docker-compose -f docker-compose.prod.yml up -d
            docker image prune -f
