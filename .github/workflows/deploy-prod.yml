name: Build and Deploy (Prod)

on:
  push:
    branches: [main]

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- BƯỚC 1: KIỂM TRA CHẤT LƯỢNG CODE ---
      - name: Setup PNPM & Node
        uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install & Check Lint
        run: |
          cd frontend && pnpm install && pnpm run lint
          cd ../backend && pnpm install && pnpm run lint

      # --- BƯỚC 2: BUILD & PUSH LÊN DOCKER HUB ---
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/anngon-frontend:latest ./frontend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/anngon-backend:latest ./backend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/anngon-nginx:latest ./nginx
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/anngon-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/anngon-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/anngon-nginx:latest

      # --- BƯỚC 3: DEPLOY LÊN VPS QUA SSH ---
      - name: 🚀 Sync Compose to VPS (Tự động copy file cấu hình)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/anngon/anngon-website"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/anngon/anngon-website
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
