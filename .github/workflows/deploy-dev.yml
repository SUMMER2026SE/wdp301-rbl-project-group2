name: Build and Deploy (Dev)

on:
  push:
    branches: [develop]

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- BƯỚC 1: KIỂM TRA CHẤT LƯỢNG CODE ---
      - name: Setup PNPM & Node
        uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      #  set up run lint sau
      - name: Install dependencies 
        run: |
          cd frontend && pnpm install
          cd ../backend && pnpm install

      # --- BƯỚC 2: BUILD & PUSH LÊN DOCKER HUB ---
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/anngon-frontend:dev ./frontend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/anngon-backend:dev ./backend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/anngon-nginx:dev ./nginx
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/anngon-frontend:dev
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/anngon-backend:dev
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/anngon-nginx:dev

      # --- BƯỚC 3: DEPLOY LÊN VPS QUA SSH ---
      - name: 🚀 Sync Compose to VPS (Tự động copy file cấu hình)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.dev.yml"
          target: "/home/anngon/anngon-website"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/anngon/anngon-website
            docker-compose -f docker-compose.dev.yml pull
            docker-compose -f docker-compose.dev.yml up -d
            docker image prune -f
