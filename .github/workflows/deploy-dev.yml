name: Build and Deploy (Dev)

on:
  push:
    branches: [develop]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4


      # --- BƯỚC 1: BUILD & PUSH LÊN DOCKER HUB ---

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/anngon-frontend:dev ./frontend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/anngon-backend:dev ./backend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/anngon-nginx:dev ./nginx
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/anngon-frontend:dev
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/anngon-backend:dev
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/anngon-nginx:dev

      # --- BƯỚC 3: DEPLOY LÊN VPS QUA SSH ---
      - name: 🚀 Sync Compose to VPS (Tự động copy file cấu hình)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.dev.yml"
          target: "/home/anngon/anngon-dev"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/anngon/anngon-dev
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker-compose -f docker-compose.dev.yml pull
            docker-compose -f docker-compose.dev.yml down
            docker-compose -f docker-compose.dev.yml up -d
            docker image prune -f
