services:
  nginx:
    image: ${DOCKERHUB_USERNAME}/anngon-nginx:latest
    ports:
      - "80:80"
      - "443:443"
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks: [ web-network ]

  fe-prod:
    image: ${DOCKERHUB_USERNAME}/anngon-frontend:latest
    restart: always
    networks: [ web-network ]

  be-prod:
    image: ${DOCKERHUB_USERNAME}/anngon-backend:latest
    env_file: .env.prod # Chứa MONGODB_URI=mongodb+srv://... (Trỏ tới DB 'my_app_prod' trên Atlas)
    restart: always
    networks: [ web-network ]

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  web-network:
    external: true
